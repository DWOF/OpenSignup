# Adds Caddy (HTTPS + organiser password) in front of the app.
# Use together with the upstream file:
#   docker compose -f docker-compose.prod.yml -f easebourne/docker-compose.caddy.yml up -d --build
services:
  web:
    # Stop publishing the app's own port; only Caddy talks to it.
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS required, e.g. signup.easebournescouts.org.uk}
      GATE_USER: ${GATE_USER:?GATE_USER required}
      GATE_HASH: ${GATE_HASH:?GATE_HASH required (caddy hash-password)}
    volumes:
      - ./easebourne/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data: {}
  caddy_config: {}
